      { id: 'pokemon-151-jp-bb', name: 'Pokemon 151 Booster Box (JP)', type: 'BOOSTER_BOX', set: 'Pokemon 151', price: 294.81, delta: 4.23, pct: 1.46, qty: 0 },
      { id: 'silver-tempest-bb', name: 'Silver Tempest Booster Box', type: 'BOOSTER_BOX', set: 'Silver Tempest', price: 522.04, delta: 2.92, pct: 0.56, qty: 0 },
      { id: 'brilliant-stars-bb', name: 'Brilliant Stars Booster Box', type: 'BOOSTER_BOX', set: 'Brilliant Stars', price: 582.41, delta: -0.40, pct: -0.07, qty: 0 },
      { id: 'twilight-masquerade-bb', name: 'Twilight Masquerade Booster Box', type: 'BOOSTER_BOX', set: 'Twilight Masquerade', price: 354.05, delta: -0.88, pct: -0.25, qty: 0 },
      { id: 'team-up-bb', name: 'Team Up Booster Box', type: 'BOOSTER_BOX', set: 'Team Up', price: 12316.89, delta: -55.56, pct: -0.45, qty: 0 },
      { id: 'base-set-1st-bb', name: 'Pokemon Base Set [1st Edition] Booster Box', type: 'BOOSTER_BOX', set: 'Base Set (1st Edition)', price: 305500.00, delta: 0.00, pct: 0.00, qty: 0 }
    ];

    // Synthesize a realistic 7-day historical curve based on current price and weekly delta
    PRODUCTS.forEach(p => {
      const startPrice = p.price - p.delta;
      const step = p.delta / 6;
      p.history7D = [
        Number((startPrice).toFixed(2)),
        Number((startPrice + step * 1).toFixed(2)),
        Number((startPrice + step * 2).toFixed(2)),
        Number((startPrice + step * 3).toFixed(2)),
        Number((startPrice + step * 4).toFixed(2)),
        Number((startPrice + step * 5).toFixed(2)),
        Number((p.price).toFixed(2))
      ];
    });

    let activeProduct = PRODUCTS[0];
    let activeFilter = 'ALL';
    let mainChart = null;

    function getBadgeConfig(type) {
      switch (type) {
        case 'ETB': return { label: 'ETB', class: 'bg-blue-500/20 text-blue-300 border-blue-500/30' };
        case 'UPC': return { label: 'UPC', class: 'bg-amber-500/20 text-amber-300 border-amber-500/30' };
        case 'PREMIUM_BOX': return { label: 'Premium', class: 'bg-purple-500/20 text-purple-300 border-purple-500/30' };
        case 'BOOSTER_BUNDLE': return { label: 'Bundle', class: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30' };
        case 'BOOSTER_BOX': return { label: 'Booster Box', class: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' };
        default: return { label: type, class: 'bg-gray-500/20 text-gray-300 border-gray-500/30' };
      }
    }

    function renderMarketMovers() {
      const moversGrid = document.getElementById('movers-grid');
      moversGrid.innerHTML = '';

      // Rank by highest absolute percentage swing
      const ranked = [...PRODUCTS].sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct)).slice(0, 4);

      ranked.forEach((item, index) => {
        const isPositive = item.pct >= 0;
        const color = isPositive ? 'text-emerald-400' : 'text-rose-400';
        const card = document.createElement('div');
        card.className = `bg-[#111827] border ${activeProduct.id === item.id ? 'border-emerald-500/80 bg-[#141e33]' : 'border-gray-800 hover:border-gray-700'} rounded-xl p-3.5 flex flex-col justify-between cursor-pointer transition duration-150 relative overflow-hidden group shadow-lg`;
        card.onclick = () => selectProduct(item.id);

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <span class="text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700 text-gray-300">
              #${index + 1} Mover
            </span>
            <span class="text-xs font-bold font-mono ${color} flex items-center gap-0.5">
              ${isPositive ? '▲ +' : '▼ '}${item.pct.toFixed(2)}%
            </span>
          </div>

          <div class="mt-2">
            <h4 class="text-xs font-bold text-gray-100 truncate group-hover:text-emerald-300 transition">${item.name}</h4>
            <div class="flex items-baseline space-x-2 mt-0.5">
              <span class="text-lg font-black font-mono text-white">$${item.price.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
              <span class="text-[11px] font-mono text-gray-400">${item.delta >= 0 ? '+$' : '-$'}${Math.abs(item.delta).toFixed(2)}</span>
            </div>
          </div>

          <div class="h-10 w-full mt-2">
            <canvas id="sparkline-${item.id}"></canvas>
          </div>
        `;

        moversGrid.appendChild(card);

        setTimeout(() => {
          renderSparkline(`sparkline-${item.id}`, item.history7D, isPositive ? '#34d399' : '#f43f5e');
        }, 10);
      });
    }

    function renderSparkline(canvasId, dataPoints, strokeColor) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['-6D', '-5D', '-4D', '-3D', '-2D', '-1D', 'Now'],
          datasets: [{
            data: dataPoints,
            borderColor: strokeColor,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 3,
            tension: 0.35,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: { display: false },
            y: { display: false }
          }
        }
      });
    }

    function updateMainChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      const isPositive = activeProduct.pct >= 0;
      const themeColor = isPositive ? '#10b981' : '#f43f5e';
      const badge = getBadgeConfig(activeProduct.type);

      document.getElementById('active-title').innerText = activeProduct.name;
      document.getElementById('active-set').innerText = `${activeProduct.set} • Sealed`;
      
      const badgeElem = document.getElementById('active-type-badge');
      badgeElem.innerText = badge.label;
      badgeElem.className = `px-2 py-0.5 rounded text-[11px] font-bold border ${badge.class}`;
      
      document.getElementById('active-price').innerText = `$${activeProduct.price.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      
      const deltaElem = document.getElementById('active-delta');
      deltaElem.innerText = `${isPositive ? '+' : ''}${activeProduct.delta.toFixed(2)} (${isPositive ? '+' : ''}${activeProduct.pct.toFixed(2)}%)`;
      deltaElem.className = `text-sm font-bold font-mono ${isPositive ? 'text-emerald-400' : 'text-rose-400'}`;

      document.getElementById('active-inventory').innerText = `${activeProduct.qty} Unit${activeProduct.qty === 1 ? '' : 's'}`;

      if (mainChart) mainChart.destroy();

      mainChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['6 Days Ago', '5 Days Ago', '4 Days Ago', '3 Days Ago', '2 Days Ago', 'Yesterday', 'Today'],
          datasets: [{
            label: `${activeProduct.name} ($)`,
            data: activeProduct.history7D,
            borderColor: themeColor,
            borderWidth: 3,
            backgroundColor: isPositive ? 'rgba(16, 185, 129, 0.12)' : 'rgba(244, 63, 94, 0.12)',
            fill: true,
            tension: 0.3,
            pointBackgroundColor: themeColor,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1f2937',
              titleColor: '#9ca3af',
              bodyColor: '#f9fafb',
              borderColor: '#374151',
              borderWidth: 1,
              padding: 10,
              displayColors: false,
              callbacks: {
                label: (ctx) => ` Price: $${ctx.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#1f2937' },
              ticks: { color: '#9ca3af', font: { size: 11 } }
            },
            y: {
              grid: { color: '#1f2937' },
              ticks: {
                color: '#9ca3af',
                font: { size: 11 },
                callback: (val) => `$${val.toLocaleString()}`
              }
            }
          }
        }
      });
    }

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      const filtered = PRODUCTS.filter(p => activeFilter === 'ALL' || p.type === activeFilter);
      document.getElementById('product-count').innerText = filtered.length;

      filtered.forEach(item => {
        const isPositive = item.pct >= 0;
        const badge = getBadgeConfig(item.type);
        const card = document.createElement('div');
        card.className = `bg-[#111827] border ${activeProduct.id === item.id ? 'border-emerald-500' : 'border-gray-800'} hover:border-gray-700 p-4 rounded-xl cursor-pointer transition flex flex-col justify-between`;
        card.onclick = () => selectProduct(item.id);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${badge.class}">
                ${badge.label}
              </span>
              <span class="text-xs font-mono font-bold ${isPositive ? 'text-emerald-400' : 'text-rose-400'}">
                ${isPositive ? '+' : ''}${item.pct.toFixed(2)}%
              </span>
            </div>
            <h4 class="text-sm font-bold text-white mt-2 leading-snug line-clamp-2">${item.name}</h4>
            <p class="text-xs text-gray-400 mt-1 truncate">${item.set}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-800 flex items-baseline justify-between">
            <span class="text-xs text-gray-400">Qty: ${item.qty}</span>
            <span class="text-base font-black font-mono text-white">$${item.price.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectProduct(id) {
      const found = PRODUCTS.find(p => p.id === id);
      if (found) {
        activeProduct = found;
        updateMainChart();
        renderMarketMovers();
        renderCatalog();
      }
    }

    function setFilter(type) {
      activeFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const matches = (type === 'ALL' && btn.innerText === 'All') ||
                        (type === 'ETB' && btn.innerText === 'ETBs') ||
                        (type === 'UPC' && btn.innerText === 'UPCs') ||
                        (type === 'PREMIUM_BOX' && btn.innerText.includes('Premium')) ||
                        (type === 'BOOSTER_BUNDLE' && btn.innerText.includes('Bundles')) ||
                        (type === 'BOOSTER_BOX' && btn.innerText.includes('Booster Boxes'));

        if (matches) {
          btn.className = 'filter-btn px-3 py-1 text-xs font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
        } else {
          btn.className = 'filter-btn px-3 py-1 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 border border-gray-700 hover:text-white';
        }
      });
      renderCatalog();
    }

    function resetFilters() {
      setFilter('ALL');
      selectProduct(PRODUCTS[0].id);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderMarketMovers();
      updateMainChart();
      renderCatalog();
    });
  </script>
</body>
</html>
